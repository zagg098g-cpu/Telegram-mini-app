function toast(msg, type='success'){
  const C = {success:['from-emerald-500','to-emerald-600','fa-circle-check'], error:['from-rose-500','to-rose-600','fa-circle-exclamation'], info:['from-slate-800','to-slate-900','fa-circle-info']}[type];
  const t = document.createElement('div');
  t.className = `fixed top-5 left-1/2 -translate-x-1/2 z-[90] pop max-w-[90%]`;
  t.innerHTML = `<div class="bg-gradient-to-br ${C[0]} ${C[1]} text-white pl-3 pr-5 py-2.5 rounded-full shadow-2xl flex items-center gap-2.5 text-sm font-black">
    <span class="w-6 h-6 rounded-full bg-white/25 flex items-center justify-center shrink-0"><i class="fa-solid ${C[2]} text-xs"></i></span>
    <span class="truncate">${esc(msg)}</span>
  </div>`;
  document.body.appendChild(t);
  setTimeout(()=>{ t.style.transition='opacity .3s,transform .3s'; t.style.opacity='0'; t.style.transform='translate(-50%,-20px)'; setTimeout(()=>t.remove(), 300); }, 1900);
}

function copyText(text, btn){
  try {
    navigator.clipboard.writeText(text);
    if(btn){ btn.classList.add('copy-flash'); setTimeout(()=>btn.classList.remove('copy-flash'), 500); }
    toast('Copied!','success');
  } catch(e){
    const ta = document.createElement('textarea');
    ta.value = text; document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); toast('Copied!','success'); } catch(_) { toast('Copy failed','error'); }
    ta.remove();
  }
}

function startBannerAuto(){
  stopBannerAuto();

function stopBannerAuto(){ if(state.bannerTimer){ clearInterval(state.bannerTimer); state.bannerTimer = null; } }
function updateBannerSlide(){
  const track = $('bannerTrack'); if(!track) return;
  track.style.transform = `translateX(-${state.bannerIdx * 100}%)`;
  document.querySelectorAll('.banner-dot').forEach((d,i)=>d.classList.toggle('active', i === state.bannerIdx));
}
function goToBanner(i){ state.bannerIdx = i; updateBannerSlide(); startBannerAuto(); }
let bannerTouchX = 0;
function bannerTouchStart(e){ bannerTouchX = e.touches[0].clientX; stopBannerAuto(); }
function bannerTouchEnd(e){
  const dx = e.changedTouches[0].clientX - bannerTouchX;
  if(Math.abs(dx) > 40){
    if(dx < 0) state.bannerIdx = Math.min(2, state.bannerIdx + 1);
    else state.bannerIdx = Math.max(0, state.bannerIdx - 1);
    updateBannerSlide();
  }
  startBannerAuto();
}

function addToCart(pid, qty=1, silent=false){
  const p = DB.get('products',[]).find(x=>x.id===pid);

  if(p.stock <= 0){ toast('Out of stock','error'); return; }
  const it = state.cart.find(c=>c.id===pid);
  if(it) it.qty += qty; else state.cart.push({id:pid, qty});
  saveCart();
  if(!silent) toast('Added to cart','success');
}
function updateCartQty(pid, qty){
  if(qty<=0) state.cart = state.cart.filter(c=>c.id!==pid);
  else { const it = state.cart.find(c=>c.id===pid); if(it) it.qty = qty; }
  saveCart(); render();
}

function cartCount(){ return state.cart.reduce((s,c)=>s+c.qty,0); }
function cartSavings(){ const P = DB.get('products',[]); return state.cart.reduce((s,c)=>{ const p=P.find(x=>x.id===c.id); return s + (p && p.old ? (p.old-p.price)*c.qty : 0); },0); }

function getDeliveryCharge(location){
  const s = getSettings();
  if(!state.cart.length) return 0;
  const subtotal = cartTotal();
  if(s.freeDeliveryThreshold > 0 && subtotal >= s.freeDeliveryThreshold) return 0;
  const P = DB.get('products',[]);
  const base = location === 'outside' ? s.deliveryOutside : s.deliveryInside;
  let maxC = 0;
  state.cart.forEach(c=>{
    const p = P.find(x=>x.id===c.id);
    if(!p) return;
    const ch = (p.delivery && p.delivery > 0) ? p.delivery : base;
    if(ch > maxC) maxC = ch;
  });
  return maxC;
}

function login(email, pass){
  const u = DB.get('users',[]).find(x=>x.email===email && x.password===pass);
  if(!u) return {ok:false, msg:'Invalid email or password'};
  if(u.blocked) return {ok:false, msg:'Account blocked'};
  state.user = u; DB.set('session_user', u);

function signup(name, phone, email, pass){
  const users = DB.get('users',[]);
  if(users.find(x=>x.email===email)) return {ok:false, msg:'Email already registered'};
  const u = {id:uid(users), name, phone, email, password:pass, village:'', upazila:'', district:'', address:'', blocked:false, joined:new Date().toISOString()};
  users.push(u); DB.set('users', users);
  state.user = u; DB.set('session_user', u);

  if(fbReady){ try { fbDb.collection('users').doc('u_'+u.id).set(u); } catch(e){} }

function buildFullAddress(u){
  const parts = [];
  if(u.address) parts.push(u.address);
  if(u.village) parts.push('গ্রাম: ' + u.village);
  if(u.upazila) parts.push('উপজেলা: ' + u.upazila);
  if(u.district) parts.push('জেলা: ' + u.district);
  return parts.join(', ');
}

function placeOrder(payload){
  const orders = DB.get('orders',[]);
  const P = DB.get('products',[]);
  const items = state.cart.map(c=>{
    const p = P.find(x=>x.id===c.id);
    return {pid:p.id, name:p.name, price:p.price, qty:c.qty, image:p.image};
  });
  items.forEach(i=>{ const p = P.find(x=>x.id===i.pid); if(p) p.stock = Math.max(0, p.stock - i.qty); });
  DB.set('products', P);
  const sub = cartTotal();
  const del = getDeliveryCharge(payload.location);
  const order = {
    id: uid(orders), user_id: state.user?.id || 0,
    user_name: payload.name, phone: payload.phone,
    village: payload.village, upazila: payload.upazila, district: payload.district,
    address: payload.address, full_address: payload.full_address,
    location: payload.location, payment: payload.payment,
    subtotal: sub, delivery: del, total: sub + del,
    status: 'Placed', created_at: new Date().toISOString(), items
  };
  orders.unshift(order);
  DB.set('orders', orders);
  /* 🔥 Firebase: save order to cloud */
  if(fbReady){ try { fbDb.collection('orders').doc('order_'+order.id+'_'+Date.now()).set(order); } catch(e){} }
  state.cart = []; saveCart();
  return order;
}

function renderProducts(){

  if(state.filter.cat) prods = prods.filter(p=>p.cat===state.filter.cat);

    const q = state.filter.search.toLowerCase();
    prods = prods.filter(p=>p.name.toLowerCase().includes(q) || p.desc.toLowerCase().includes(q));
  }
  prods = prods.filter(p => p.price <= state.filter.maxPrice);
  if(state.filter.sort==='low')  prods.sort((a,b)=>a.price-b.price);

  if(state.filter.sort==='pop')  prods.sort((a,b)=>b.sold-a.sold);

function submitOrder(){
  const u = state.user;
  if(!u){ toast('Login required','error'); go('login'); return; }
  if(!u.name || !u.phone || !u.village || !u.upazila || !u.district){ toast('Complete your country/address first','error'); setTimeout(()=>go('country'), 800); return; }
  const pay = document.querySelector('input[name="pay"]:checked').value;
  const fullAddr = buildFullAddress(u);
  const sub = cartTotal();
  const del = getDeliveryCharge(checkoutLocation);
  const total = sub + del;
  if(pay === 'Wallet'){ const bal = getMyBalance(); if(bal < total){ toast('Insufficient wallet balance','error'); return; } }
  showLoader();
  setTimeout(()=>{
    if(pay === 'Wallet'){
      setMyBalance(getMyBalance() - total);
      const t = DB.get('transactions',[]);
      t.unshift({id:uid(t), userId:u.id, userName:u.name, type:'debit', amount:total, note:'Order payment', method:'Wallet', createdAt:new Date().toISOString()});
      DB.set('transactions', t);
    }
    const o = placeOrder({name:u.name, phone:u.phone, village:u.village, upazila:u.upazila, district:u.district, address:u.address, full_address:fullAddr, payment:pay, location:checkoutLocation});
    showLoader(false);
    openModal(`
      <div class="p-7 text-center">
        <div class="w-20 h-20 mx-auto rounded-full bg-emerald-100 flex items-center justify-center mb-4 pulse-ring"><i class="fa-solid fa-check text-emerald-600 text-3xl"></i></div>
        <h3 class="font-black text-xl text-slate-900">Order Confirmed!</h3>
        <p class="text-sm text-slate-500 mt-1 font-semibold">Your order has been placed</p>
        <div class="mt-5 bg-slate-50 rounded-2xl p-4 text-left space-y-2">
          <div class="flex justify-between text-xs"><span class="text-slate-500 font-bold">Order ID</span><span class="font-black text-slate-800">#${o.id}</span></div>
          <div class="flex justify-between text-xs"><span class="text-slate-500 font-bold">Payment</span><span class="font-black text-slate-800">${o.payment}</span></div>
          <div class="flex justify-between text-xs border-t border-slate-200 pt-2 mt-1"><span class="text-slate-500 font-bold">Total</span><span class="font-black text-emerald-600">${money(o.total)}</span></div>
        </div>
        <div class="flex gap-2 mt-5">
          <button onclick="closeModal();go('orders')" class="press flex-1 btn-grad text-white py-3.5 rounded-2xl font-black text-sm shadow-glow">Track Order</button>
          <button onclick="closeModal();go('products')" class="press flex-1 bg-slate-100 text-slate-700 py-3.5 rounded-2xl font-black text-sm">Continue</button>
        </div>
      </div>
    `);
  }, 900);
}

function toggleDet(id){ const d = $('dt-'+id), c = $('ch-'+id); d.classList.toggle('hidden'); c.style.transform = d.classList.contains('hidden') ? '' : 'rotate(180deg)'; }
function tracker(status){
  if(status === 'Cancelled') return `<div class="flex items-center gap-2.5 bg-rose-50 text-rose-600 rounded-2xl px-3.5 py-3 text-sm font-black"><i class="fa-solid fa-circle-xmark"></i> Order Cancelled</div>`;
  const steps = ['Placed','Dispatched','Delivered'];
  const icons = ['fa-clipboard-check','fa-truck-fast','fa-circle-check'];
  const idx = Math.max(0, steps.indexOf(status));
  let h = '<div class="flex items-start">';
  steps.forEach((s,i)=>{
    const done = i <= idx;
    h += `<div class="flex flex-col items-center" style="width:56px"><div class="w-9 h-9 rounded-full flex items-center justify-center text-xs ${done ? 'btn-grad text-white shadow-glow' : 'bg-slate-100 text-slate-400'}"><i class="fa-solid ${icons[i]}"></i></div><span class="text-[10px] mt-1.5 font-black ${done ? 'text-emerald-700' : 'text-slate-400'}">${s}</span></div>`;
    if(i < steps.length-1) h += `<div class="flex-1 h-1 rounded-full mt-4 ${i<idx ? 'bg-gradient-to-r from-emerald-500 to-emerald-600' : 'bg-slate-200'}"></div>`;
  });
  return h + '</div>';
}

    $('app').innerHTML = `

function doDeposit(){
  const pi = getPaymentInfo();
  const method = state.walletMethod;
  const methodLabel = {bkash:'BKash', nagad:'Nagad', bank:'Bank'}[method];
  const methodType = method === 'bank' ? 'Bank Transfer' : pi[method].method;
  const amount = +$('depAmount').value;
  const txnId = $('depTxn').value.trim();
  const sender = $('depSender').value.trim();
  if(!amount || amount < pi.minDeposit){ toast(`Minimum deposit ${money(pi.minDeposit)}`,'error'); return; }
  if(!txnId){ toast('Enter transaction ID','error'); return; }
  if(!sender){ toast('Enter your number','error'); return; }
  showLoader();
  setTimeout(()=>{
    const d = submitDeposit(method, amount, txnId, sender, methodType);
    if(pi.autoApprove){
      const wallets = getWallets();
      const currentBal = wallets[state.user.id] || 0;
      setMyBalance(currentBal + amount);
      const t = DB.get('transactions',[]);
      t.unshift({id:uid(t), userId: state.user.id, userName: state.user.name, type:'deposit', amount, note:`Wallet deposit via ${methodType}`, method, balanceBefore: currentBal, balanceAfter: currentBal + amount, createdAt: new Date().toISOString()});
      DB.set('transactions', t);
      const deps = getDeposits();
      const idx = deps.findIndex(x=>x.id === d.id);
      if(idx > -1){ deps[idx].status = 'approved'; deps[idx].reviewedAt = new Date().toISOString(); }
      DB.set('deposits', deps);
    }
    showLoader(false);
    const finalStatus = pi.autoApprove ? 'approved' : 'pending';
    openModal(`
      <div class="p-7 text-center">
        <div class="w-20 h-20 mx-auto rounded-full ${pi.autoApprove ? 'bg-emerald-100 pulse-ring' : 'bg-amber-100 pulse-ring'} flex items-center justify-center mb-4">
          <i class="fa-solid ${pi.autoApprove ? 'fa-check text-emerald-600' : 'fa-clock text-amber-600'} text-3xl"></i>
        </div>
        <h3 class="font-black text-xl text-slate-900">${pi.autoApprove ? 'Deposit Successful!' : 'Deposit Submitted!'}</h3>
        <p class="text-sm text-slate-500 mt-1 font-semibold">${pi.autoApprove ? 'আপনার ব্যালেন্সে টাকা যোগ হয়েছে' : 'অ্যাডমিন ভেরিফাই করলে ব্যালেন্স যোগ হবে'}</p>
        <div class="mt-5 bg-slate-50 rounded-2xl p-4 text-left space-y-2">
          <div class="flex justify-between text-xs"><span class="text-slate-500 font-bold">Amount</span><span class="font-black text-slate-800">${money(amount)}</span></div>
          <div class="flex justify-between text-xs"><span class="text-slate-500 font-bold">Method</span><span class="font-black text-slate-800">${methodLabel}</span></div>
          <div class="flex justify-between text-xs"><span class="text-slate-500 font-bold">Type</span><span class="font-black text-slate-800">${esc(methodType)}</span></div>
          <div class="flex justify-between text-xs"><span class="text-slate-500 font-bold">TrxID</span><span class="font-black text-slate-800">${esc(txnId)}</span></div>
          <div class="flex justify-between text-xs border-t border-slate-200 pt-2 mt-1"><span class="text-slate-500 font-bold">Status</span><span class="font-black ${pi.autoApprove ? 'text-emerald-600' : 'text-amber-600'}">${finalStatus.toUpperCase()}</span></div>
        </div>
        <button onclick="closeModal();go('wallet')" class="press w-full mt-5 wallet-grad text-white py-3.5 rounded-2xl font-black shadow-glow-violet">
          Back to Wallet
        </button>
      </div>
    `);
  }, 800);

function togglePass(id){
  const inp = $(id), eye = $(id+'-eye');
  if(inp.type === 'password'){ inp.type = 'text'; eye.className = 'fa-solid fa-eye-slash text-slate-500 text-xs'; }
  else { inp.type = 'password'; eye.className = 'fa-solid fa-eye text-slate-500 text-xs'; }
}
function doChangePassword(){
  const o = $('secOld').value, n = $('secNew').value, c = $('secConfirm').value;
  if(!o || !n || !c){ toast('Fill all fields','error'); return; }
  if(n.length < 4){ toast('Password too short (min 4)','error'); return; }
  if(n !== c){ toast('Passwords do not match','error'); return; }
  if(o !== state.user.password){ toast('Current password is wrong','error'); return; }
  showLoader();
  setTimeout(()=>{
    const users = DB.get('users',[]);
    const i = users.findIndex(x=>x.id===state.user.id);
    users[i].password = n;
    DB.set('users', users);
    state.user.password = n; DB.set('session_user', state.user);
    showLoader(false);
    $('secOld').value = ''; $('secNew').value = ''; $('secConfirm').value = '';
    openModal(`

function saveCountry(){
  const name = $('ctyName').value.trim(), phone = $('ctyPhone').value.trim();
  const village = $('ctyVillage').value.trim(), upazila = $('ctyUpazila').value.trim();
  const district = $('ctyDistrict').value.trim(), address = $('ctyAddress').value.trim();
  if(!name){ toast('Enter your name','error'); return; }
  if(!phone || phone.length < 11){ toast('Enter valid phone (11 digits)','error'); return; }
  if(!village){ toast('Enter village (গ্রাম)','error'); return; }
  if(!upazila){ toast('Enter upazila (উপজেলা)','error'); return; }
  if(!district){ toast('Enter district (জেলা)','error'); return; }
  showLoader();
  setTimeout(()=>{
    const u = { ...state.user, name, phone, village, upazila, district, address };
    const users = DB.get('users',[]);
    const i = users.findIndex(x=>x.id===u.id);
    if(i>-1){ users[i] = u; DB.set('users', users); }
    state.user = u; DB.set('session_user', u);

    if(fbReady){ try { fbDb.collection('users').doc('u_'+u.id).set(u); } catch(e){} }

function renderChatBubble(msg){
  const isUser = msg.role === 'user';
  const time = new Date(msg.time).toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit'});
  return `
    <div class="flex gap-2 items-end ${isUser?'flex-row-reverse slide-left':'slide-right'}">
      <div class="w-8 h-8 rounded-full ${isUser?'btn-grad':'ai-grad'} flex items-center justify-center text-white shrink-0 shadow"><i class="fa-solid ${isUser?'fa-user':'fa-robot'} text-xs"></i></div>
      <div class="${isUser?'chat-bubble-user':'chat-bubble-bot'} px-4 py-3 rounded-2xl ${isUser?'rounded-br-sm':'rounded-bl-sm'} max-w-[78%]">
        <p class="text-[13px] font-semibold leading-relaxed whitespace-pre-line">${esc(msg.text)}</p>
        <div class="flex items-center gap-1 justify-end mt-1.5"><span class="text-[9px] ${isUser?'text-emerald-100':'text-slate-400'} font-bold">${time}</span>${isUser?`<i class="fa-solid fa-check-double text-[8px] text-emerald-100"></i>`:''}</div>
      </div>
    </div>`;
}
function quickAsk(q){ const inp = $('chatInput'); if(inp){ inp.value = q; sendChat(); } }
function sendChat(){
  const inp = $('chatInput'); if(!inp) return;
  const msg = inp.value.trim(); if(!msg) return;
  inp.value = '';
  state.chatHistory.push({role:'user', text:msg, time:new Date().toISOString()});
  DB.set('chat_history', state.chatHistory);
  state.chatTyping = true;
  renderAIChat();
  const delay = 700 + Math.random() * 700;
  setTimeout(()=>{
    const reply = getAIResponse(msg);
    state.chatTyping = false;
    state.chatHistory.push({role:'bot', text:reply, time:new Date().toISOString()});
    DB.set('chat_history', state.chatHistory);
    renderAIChat();
  }, delay);
}
function clearChat(){
  if(!confirm('Clear chat history?')) return;
  state.chatHistory = []; DB.set('chat_history', []); renderAIChat(); toast('Chat cleared','info');
}

function doLogin(){
  const email = $('authEmail').value.trim(), pass = $('authPass').value;
  if(!email || !pass){ showAuthErr('Fill all fields'); return; }
  if(!email.includes('@')){ showAuthErr('Enter valid email'); return; }
  showLoader();
  setTimeout(()=>{
    const r = login(email, pass);
    showLoader(false);
    if(!r.ok) return showAuthErr(r.msg);
    toast('Welcome back!','success'); go('home');
  }, 700);
}
function doSignup(){
  const name = $('suName').value.trim(), phone = $('suPhone').value.trim();
  const email = $('authEmail').value.trim(), pass = $('authPass').value;
  if(!name || !phone || !email || !pass){ showAuthErr('Fill all fields'); return; }
  if(!email.includes('@')){ showAuthErr('Enter valid email'); return; }
  if(phone.length < 11){ showAuthErr('Phone must be 11 digits'); return; }
  if(pass.length < 4){ showAuthErr('Password too short'); return; }
  showLoader();
  setTimeout(()=>{
    const r = signup(name, phone, email, pass);
    showLoader(false);
    if(!r.ok) return showAuthErr(r.msg);
    toast('Account created!','success'); go('country');
  }, 700);
}
function showAuthErr(msg){ const e = $('authErr'), m = $('authErrMsg'); m.textContent = msg; e.classList.remove('hidden'); }

/* ---- INIT ---- */
render();
/* Sync settings from Firebase after initial render (if configured) */
setTimeout(()=>{ fbSyncSettings(); }, 800);
</script>
</body>
</html>
