    box-shadow: 0 0 10px #087bff;

}

.glow-btn:hover {
    transform: scale(1.05);
}

.glow-btn.active {
    background: #087bff;
    border-color: #75caff;

    box-shadow:

        0 0 50px #008cff,
        0 0 90px #006eff;
    animation: pulse 1.5s infinite alternate;
}

@keyframes pulse {
    from {
        box-shadow: 0 0 15px #008cff,
                    0 0 30px #008cff;
    }
    to {
        box-shadow: 0 0 30px #008cff,
                    0 0 65px #008cff,
                    0 0 100px #006eff;
    }
}
